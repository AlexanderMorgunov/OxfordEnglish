      <h1>DayEnglish — учить английский язык с нуля бесплатно, уровни A1 → B1</h1>
      <p>
        DayEnglish — бесплатное приложение для изучения английского языка с нуля до среднего уровня
        (A1, A2, B1). Подходит для начинающих и тех, кто хочет заниматься английским самостоятельно,
        по 15 минут в день. Учите английский офлайн — уроки, повторения и чтение книг работают без
        интернета после первой загрузки. Без рекламы, подписок и сбора личных данных.
      </p>
      <h2>Что входит в курс английского</h2>
      <ul>
        <li>Ежедневные уроки английского по «учебным дням»: новые слова, грамматика, практика.</li>

        <li>Чтение и аудирование: тексты с переводом и озвучкой, разбор по предложениям.</li>
        <li>Интервальные повторения слов (spaced repetition), чтобы лексика не забывалась.</li>
        <li>Встроенная читалка книг на английском с переводом слов и фраз по клику.</li>
        <li>Тест на уровень английского в начале — подскажет, с чего начать.</li>
      </ul>
