name: deploy-yc

# Deploys dist/ to Yandex Object Storage (CDN-fronted). Runs on main once enabled, or manually.
# Guarded on the repo variable YC_DEPLOY_ENABLED so it stays a no-op until the bucket + secrets exist
# (Settings → Secrets and variables → Actions → Variables: YC_DEPLOY_ENABLED = true).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-yc
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.YC_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ship only green: lint + tests + typechecked build (same gate as ci.yml).
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # A literal, not a secret: this URL is in every request the browser makes, and an EMPTY value
          # is not a safe default here — `accountsEnabled()` reads it, so an unset secret silently ships
          # a build with no sign-in, no sync, no TOTP and no paywall, against a backend that is running
          # perfectly. That is exactly what happened until 2026-09-15.
          VITE_API_BASE: https://api.dayenglish.ru
          VITE_YANDEX_METRICA_ID: ${{ secrets.VITE_YANDEX_METRICA_ID }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_FEEDBACK_ENDPOINT: ${{ secrets.VITE_FEEDBACK_ENDPOINT }}
          VITE_FEEDBACK_EMAIL: ${{ secrets.VITE_FEEDBACK_EMAIL }}
          VITE_SUPPORT_URL: ${{ secrets.VITE_SUPPORT_URL }}
      - name: Deploy to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_ENDPOINT_URL: https://storage.yandexcloud.net
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
        run: bash scripts/deploy-yc.sh
