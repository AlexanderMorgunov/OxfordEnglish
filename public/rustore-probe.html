<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WebView probe</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #12141c; color: #ece8dd;
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #57c9bd; margin: 0 0 14px; }
  .row { border-bottom: 1px solid #2a2e3e; padding: 8px 0; }
  .k { color: #8b90a0; }
  .ok { color: #57c9bd; }
  .bad { color: #e8706a; }
  .warn { color: #e9a94b; }
  button { font: inherit; background: #1a1d29; color: inherit; border: 1px solid #2a2e3e;
           border-radius: 4px; padding: 8px 12px; margin: 4px 4px 4px 0; }
  textarea { width: 100%; height: 190px; margin-top: 12px; background: #1a1d29; color: inherit;
             border: 1px solid #2a2e3e; border-radius: 4px; font: inherit; padding: 8px; }
</style>
</head>
<body>
<h1>DayEnglish · WebView probe</h1>

<div id="out"></div>

<div class="row">
  <button id="speak">Проверить озвучку вслух</button>
  <button id="audio">Проверить перемотку аудио</button>
  <button id="pick">Проверить выбор файла</button>
  <button id="persist">Проверить persist() нажатием</button>
  <input id="file" type="file" accept=".epub,.fb2,.docx,.pdf" hidden>
</div>

<textarea id="report" readonly></textarea>
<button id="copy">Скопировать отчёт</button>

<script>
const lines = [];
const out = document.getElementById('out');
const report = document.getElementById('report');

function say(key, value, state) {
  lines.push(key + ': ' + value);
  // WebView console output lands in logcat, so `adb logcat -s chromium:I` reads the whole report
  // without attaching a debugger — including the async storage lines that arrive after load.
  console.log('[probe] ' + key + ': ' + value);
  const cls = state === true ? 'ok' : state === false ? 'bad' : state === 'warn' ? 'warn' : 'k';
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = '<span class="k">' + key + '</span> — <span class="' + cls + '">' + String(value).replace(/[<&]/g, (c) => (c === '<' ? '&lt;' : '&amp;')) + '</span>';
  out.appendChild(div);
  report.value = lines.join('\n');
}

// --- environment -----------------------------------------------------------
const ua = navigator.userAgent;
say('user agent', ua);
const m = ua.match(/Chrome\/(\d+)/);
const chromeMajor = m ? Number(m[1]) : 0;
// OPFS needs WebView 109+; that, not Capacitor's minSdk, is the real device floor.
say('движок Chromium', chromeMajor || 'не определён', chromeMajor >= 109);
say('это WebView (wv)', /\bwv\b/.test(ua) ? 'да — настоящий WebView' : 'нет, обычный браузер', /\bwv\b/.test(ua) ? true : 'warn');
say('secure context', String(window.isSecureContext), window.isSecureContext);

// --- speech ----------------------------------------------------------------
// The whole read-aloud feature is gated on this existing. MDN records it as absent in Android WebView.
const hasSpeech = 'speechSynthesis' in window;
say('speechSynthesis существует', String(hasSpeech), hasSpeech);
if (hasSpeech) {
  const report_ = () => say('голосов доступно', String(speechSynthesis.getVoices().length), speechSynthesis.getVoices().length > 0);
  report_();
  speechSynthesis.onvoiceschanged = report_;
}

// --- storage ---------------------------------------------------------------
(async () => {
  say('OPFS (storage.getDirectory)', String(!!navigator.storage?.getDirectory), !!navigator.storage?.getDirectory);
  if (navigator.storage?.getDirectory) {
    try {
      const root = await navigator.storage.getDirectory();
      const dir = await root.getDirectoryHandle('probe', { create: true });
      const fh = await dir.getFileHandle('t.bin', { create: true });
      const w = await fh.createWritable();
      await w.write(new Blob([new Uint8Array(1024 * 512)])); // 512 KB
      await w.close();
      const back = await (await fh.getFile()).size;
      say('OPFS запись/чтение 512 КБ', back === 524288 ? 'работает' : 'вернулось ' + back, back === 524288);
      await root.removeEntry('probe', { recursive: true });
    } catch (e) {
      say('OPFS запись/чтение', 'ошибка: ' + e.name, false);
    }
  }
  // `persist()` is a no-op in WebView, which is why book files and progress would be evictable there.
  try {
    const persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : null;
    const granted = navigator.storage?.persist ? await navigator.storage.persist() : null;
    say('storage.persisted()', String(persisted), persisted === true ? true : 'warn');
    say('storage.persist() выдал разрешение', String(granted), granted === true ? true : false);
  } catch (e) {
    say('storage.persist()', 'ошибка: ' + e.name, false);
  }
  try {
    const est = await navigator.storage.estimate();
    say('квота', Math.round((est.quota || 0) / 1048576) + ' МБ, занято ' + Math.round((est.usage || 0) / 1048576) + ' МБ');
  } catch { say('квота', 'недоступна', 'warn'); }

  try {
    const db = indexedDB.open('probe-db');
    await new Promise((res, rej) => { db.onsuccess = res; db.onerror = rej; });
    say('IndexedDB', 'открывается', true);
    indexedDB.deleteDatabase('probe-db');
  } catch { say('IndexedDB', 'недоступен', false); }
})();

// --- interactive checks ----------------------------------------------------
document.getElementById('speak').onclick = () => {
  if (!('speechSynthesis' in window)) { say('озвучка вслух', 'API отсутствует — проверять нечего', false); return; }
  const u = new SpeechSynthesisUtterance('The gong rang twice, and then, silence.');
  u.lang = 'en-US';
  u.onstart = () => say('озвучка вслух', 'началась — слышно?', true);
  u.onerror = (e) => say('озвучка вслух', 'ошибка: ' + e.error, false);
  speechSynthesis.speak(u);
};

function once(el, ev, ms) {
  return new Promise((res, rej) => {
    const done = (fn) => () => { clearTimeout(t); el.removeEventListener(ev, ok); el.removeEventListener('error', bad); fn(); };
    const ok = done(res);
    const bad = done(() => rej(new Error('error')));
    const t = setTimeout(done(() => rej(new Error('timeout'))), ms);
    el.addEventListener(ev, ok, { once: true });
    el.addEventListener('error', bad, { once: true });
  });
}

/** Multi-second silence built at runtime. The previous inline data URI was a 44-byte WAV header with a
 *  zero-length `data` chunk — duration 0, so every seek clamped to 0 and the check failed everywhere. */
function silentWavUrl(seconds) {
  const rate = 8000;
  const n = rate * seconds;
  const buf = new ArrayBuffer(44 + n);
  const v = new DataView(buf);
  const ascii = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  ascii(0, 'RIFF'); v.setUint32(4, 36 + n, true); ascii(8, 'WAVE');
  ascii(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  ascii(36, 'data'); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).fill(128); // 8-bit unsigned PCM: 128 is silence, not 0
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

// A-B loop and dictation timings both depend on seeking. Two separate questions: whether the
// `currentTime` setter works at all (local blob, fully buffered), and whether seeking a STREAMED file
// works (network mp3 → range requests through the service worker) — which is what the player does.
async function seekTest(label, src) {
  const a = new Audio();
  a.preload = 'metadata';
  a.src = src;
  try {
    await once(a, 'loadedmetadata', 10000);
  } catch {
    say(label, a.error ? 'не загрузился, media error ' + a.error.code : 'метаданные не пришли за 10 с', false);
    return;
  }
  if (!isFinite(a.duration) || a.duration < 2) {
    say(label, 'длительность ' + a.duration + ' — тест непригоден', 'warn');
    return;
  }
  const target = Math.min(1.5, a.duration - 0.5);
  let blocked = false;
  try { await a.play(); } catch { blocked = true; }
  a.currentTime = target;
  try {
    await once(a, 'seeked', 5000);
  } catch {
    say(label, 'событие seeked не пришло, currentTime = ' + a.currentTime.toFixed(2), false);
    a.pause();
    return;
  }
  const hit = Math.abs(a.currentTime - target) < 0.5;
  say(label, 'цель ' + target.toFixed(2) + ' с → ' + a.currentTime.toFixed(2) + ' с (длина ' +
    a.duration.toFixed(1) + ' с)' + (blocked ? ', play() заблокирован политикой' : ''), hit);
  a.pause();
}

document.getElementById('audio').onclick = async () => {
  await seekTest('перемотка (локальный файл)', silentWavUrl(4));
  await seekTest('перемотка (mp3 с сервера)', '/packs/dev-english-a2/media/audio/u00.d01.listening.mp3');
};

document.getElementById('pick').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  say('выбор файла', f ? f.name + ', ' + f.size + ' байт' : 'ничего не выбрано', !!f);
};

document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(report.value); say('отчёт', 'скопирован', true); }
  catch { report.select(); say('отчёт', 'выделен — скопируйте вручную', 'warn'); }
};

/**
 * `persist()` called at page load returns false in Chrome and WebView alike — no user activation, no
 * engagement, denied by design. That is a fact about the call, not about WebView, so the load-time
 * result below cannot answer whether book storage is evictable. This button asks again from inside a
 * real touch event; only THAT answer is worth quoting.
 */
document.getElementById('persist').onclick = async () => {
  try {
    const granted = await navigator.storage.persist();
    const persisted = await navigator.storage.persisted();
    say('persist() ПОСЛЕ нажатия', 'persist=' + granted + ', persisted=' + persisted, granted === true);
  } catch (e) {
    say('persist() ПОСЛЕ нажатия', 'ошибка: ' + e.name, false);
  }
};

// Run the checks without a tap. A headless emulator has nobody to press the buttons, and guessing
// coordinates for `adb shell input tap` is a worse bet than just running them. The buttons stay live
// for a manual re-run; speech and playback may report "заблокирован политикой" without a gesture,
// which the report states rather than hides — seeking works on a paused element either way.
// `persist` is deliberately NOT auto-clicked: a synthetic .click() is not user activation, so
// auto-running it would reproduce the very false negative this button exists to avoid.
setTimeout(() => {
  say('автозапуск', 'проверки запущены без нажатия', 'warn');
  document.getElementById('speak').click();
  document.getElementById('audio').click();
  // Device-pixel centre of the persist button, so `adb shell input tap` hits it without eyeballing.
  const r = document.getElementById('persist').getBoundingClientRect();
  const d = window.devicePixelRatio || 1;
  say('tap persist', Math.round((r.left + r.width / 2) * d) + ' ' + Math.round((r.top + r.height / 2) * d));
}, 1200);
</script>
</body>
</html>
